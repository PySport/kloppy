event_types:
  kloppy.domain.GenericEvent:
    providers:
      statsbomb:
        status: parsed
      statsperform:
        status: parsed
      wyscout_v2:
        status: parsed
      wyscout_v3:
        status: parsed
      datafactory:
        status: parsed
      sportec:
        status: parsed
      metrica_json:
        status: parsed
      impect:
        status: parsed
      footovision:
        status: parsed
        implementation: Fallback for records not classified as a supported event; includes standalone tag 734 substitution markers without an incoming/outgoing pair.
    attributes:
      time:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'timestamp' field
          footovision:
            status: parsed
            implementation: startTime in milliseconds within the period; game.json events use formation.time.
      coordinates:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'location' field
          footovision:
            status: parsed
            implementation: startX/startY in normalized pitch coordinates, transformed if requested; absent for game.json events.
      team:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'team' field
          footovision:
            status: parsed
            implementation: teamId resolved against game.json teams; metadata events use the corresponding home/away team.
      player:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'player' field
          footovision:
            status: parsed
            implementation: playerId resolved against the team roster; metadata events use playerOut or playerIn where applicable.
      ball_owning_team:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'possession_team' field
          footovision:
            status: inferred
            implementation: Acting team for passes, shots, take-ons, carries, clearances and recoveries; otherwise None.
      ball_state:
        providers:
          statsbomb:
            status: parsed
            implementation: BallState.DEAD for synthetic ball out events; otherwise BallState.ALIVE
          footovision:
            status: inferred
            implementation: ALIVE for passes, shots, take-ons, carries, clearances and recoveries; DEAD for substitutions; otherwise None, including ball-out events.
      raw_event:
        providers:
          statsbomb:
            status: parsed
          footovision:
            status: parsed
            implementation: Original event record; game.json events retain source, formation and applicable reason.
      related_event_ids:
        providers:
          statsbomb:
            status: parsed
            implementation: value of the 'related_events' field
          footovision:
            status: inferred
            implementation: Links passes to subsequent ball-out/offside context, fouls to a same-player card before play resumes, exactly two tag-3 records sharing halftime/startTime, injury exits to returns, and lineup changes to simultaneous tactical changes.
      freeze_frame:
        providers:
          statsbomb:
            status: parsed
            implementation: tracking data frame created from the 'freeze_frame' field for shots or from a 360 data file for other events
          footovision:
            status: not implemented
      timestamp:
        providers:
          footovision:
            status: parsed
            implementation: startTime converted from milliseconds to timedelta; game.json events use formation.time.
      period:
        providers:
          footovision:
            status: parsed
            implementation: Period matched by halftime; game.json events use formation.halftime.
      state:
        providers:
          footovision:
            status: parsed
            implementation: Preserves teamPhaseId, opponentPhaseId and sequenceId as team_phase_id, opponent_phase_id and sequence_id. Duels and pressures add target-player details; goalkeeper events preserve subtype flags; metadata events identify game.json as source.
  kloppy.domain.PassEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 30/'Pass'
      statsperform:
        status: parsed
        implementation: event type 1/'Pass' or 2/'Offside pass'
      wyscout_v2:
        status: parsed
        implementation: event type 8/'Pass' or subtype 30/'Corner', 31/'Free kick',  32/'Free kick (cross)', 34/'Goal kick', 36/'Throw in'
      wyscout_v3:
        status: parsed
        implementation: primary event type any of 'pass', 'goal_kick' or 'throw_in', or 'corner', 'free_kick' that is not 'shot' as secondary event type
      sportec:
        status: parsed
        implementation: event type 'Pass' or 'Cross'
      metrica_json:
        status: parsed
        implementation: event type 1/'PASS'
      impect:
        status: parsed
        implementation: event type 'PASS', 'KICK_OFF', 'THROW_IN', 'FREE_KICK', 'PENALTY_KICK', 'GOAL_KICK', or 'CORNER'
      footovision:
        status: parsed
        implementation: Tag 11, 429 (goalkeeper throw), or 438 (goalkeeper kick). Also infers untagged offside passes with valid playerId, targetPlayerId, teamId, xP, timing and coordinates, followed by a same-team offside marker (408) in the same period within 1000 ms of endTime, ignoring intervening annotations.
    attributes:
      receive_timestamp:
        providers:
          statsbomb:
            status: parsed
            implementation: sum of 'timestamp' and 'duration' fields
          sportec:
            status: not implemented
            implementation: null
          metrica_json:
            status: parsed
            implementation: time difference between event's end time and start of period
          footovision:
            status: parsed
            implementation: endTime converted from milliseconds to timedelta within the period.
      receiver_coordinates:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'pass.end_location' field
          sportec: 
            status: parsed
            implementation: X/Y-Source-Position of subsequent event
          metrica_json:
            status: parsed
            implementation: value of 'event.end' field
          footovision:
            status: parsed
            implementation: endX/endY, transformed to the requested coordinate system.
      receiver_player:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'pass.recipient' field
          sportec:
            status: parsed
            implementation: value of 'Recipient' field
          metrica_json:
            status: parsed
            implementation: value of 'event.to' field
          footovision:
            status: parsed
            implementation: targetPlayerId resolved within the acting team; None if missing or not found.
      result:
        providers:
          statsbomb:
            status: parsed
          sportec:
            status: parsed
          metrica_json:
            status: parsed
          footovision:
            status: parsed
        values:
          COMPLETE:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome is not defined
              sportec:
                status: parsed
                implementation: successfullyCompleted or successful from [Play / Evaluation]
              metrica_json:
                status: parsed
                implementation: outcome 1/'COMPLETE'
              footovision:
                status: parsed
                implementation: Tag 80, after checking the untagged offside-pass fallback.
          INCOMPLETE:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 9/'Incomplete'
              sportec:
                status: parsed
                implementation: if not successfullyCompleted or successful (unsuccessful) [Play / Evaluation]
              metrica_json:
                status: parsed
                implementation: outcome 7/'INCOMPLETE'
              footovision:
                status: inferred
                implementation: No tag 80 and no following ball-out/offside context or untagged offside fallback.
          OUT:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 75/'Out' or 74/'Injury Clearance'
              sportec:
                status: inferred
                implementation: When action is SET_PIECE, and previous action was pass, set pass outcome to unsuccessful 
              metrica_json:
                status: parsed
                implementation: outcome 6/'OUT'
              footovision:
                status: inferred
                implementation: No tag 80 and the next relevant ball-context record in the same period has tag 82.
          OFFSIDE:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 76/'Pass Offside'
              sportec:
                status: not supported
                implementation: null
              metrica_json:
                status: parsed
                implementation: outcome 16/'OFFSIDE'
              footovision:
                status: inferred
                implementation: Untagged offside-pass fallback, or no tag 80 and the next relevant ball-context record in the same period has tag 408.
  kloppy.domain.ShotEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 16/'Shot' or 20/'Own goal against'
      statsperform:
        status: parsed
        implementation: event type 13/'Shot (miss)' or 14/'Shot (post)' or 15/'Shot (saved)' or 16/'Shot (goal)'
      wyscout_v2:
        status: parsed
        implementation: event type 10/'Shot' or subtype 33/'Free kick (shot)', 35/'Penalty'
      wyscout_v3:
        status: parsed
        implementation: primary event type any of 'shot', 'own_goal' or 'penalty' or 'free_kick' or 'corner' with secondary event type 'shot'
      sportec:
        status: parsed
        implementation: event type 'ShotWide' or 'SavedShot' or 'BlockedShot' or 'ShotWoodWork' or 'OtherShot' or 'SuccessfulShot' or 'OwnGoal'
      metrica_json:
        status: parsed
        implementation: event type 2/'SHOT'
      impect:
        status: parsed
        implementation: event type 'SHOT'
      footovision:
        status: parsed
        implementation: Tag 14; shot result tags alone do not create a shot.
    attributes:
      result_coordinates:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'shot.end_location' field
          sportec:
            status: not implemented
            implementation: null
          metrica_json:
            status: not implemented
            implementation: null
          footovision:
            status: parsed
            implementation: endX/endY, transformed to the requested coordinate system.
      result:
        providers:
          statsbomb:
            status: parsed
          sportec:
            status: parsed
          metrica_json:
            status: parsed
          footovision:
            status: parsed
        values:
          GOAL:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 97/'Goal'
              sportec:
                status: parsed
                implementation: outcome SuccessfulShot
              metrica_json:
                status: parsed
                implementation: outcome 30/'GOAL'
              footovision:
                status: parsed
                implementation: Tag 83, unless tag 44 is present.
          OFF_TARGET:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 98/'off T' or 101/'Wayward'
              sportec:
                status: parsed
                implementation: outcome ShotWide
              metrica_json:
                status: parsed
                implementation: outcome 29/'OFF TARGET'
              footovision:
                status: inferred
                implementation: Fallback when tags 44, 83 and 32 are absent.
          POST:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome  99/'Post'
              sportec:
                status: parsed
                implementation: outcome ShotWoodWork
              metrica_json:
                status: parsed
                implementation: outcome 27/'POST'
              footovision:
                status: not implemented
                implementation: No distinct woodwork outcome is mapped.
          BLOCKED:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 96/'Blocked'
              sportec:
                status: parsed
                implementation: outcome BlockedShot
              metrica_json:
                status: parsed
                implementation: outcome 25/'BLOCKED'
              footovision:
                status: parsed
                implementation: Tags 32 and 745, unless an own-goal/goal outcome applies.
          SAVED:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 100/'Saved' or 115/'Saved Off T' or 116/'Saved To Post'
              sportec:
                status: parsed
                implementation: outcome SavedShot
              metrica_json:
                status: parsed
                implementation: outcome 26/'SAVED'
              footovision:
                status: parsed
                implementation: Tag 32 without tag 745, unless an own-goal/goal outcome applies.
          OWN_GOAL:
            providers:
              statsbomb:
                status: parsed
                implementation: event type 20/'Own goal against'
              sportec:
                status: parsed
                implementation: outcome OwnGoal
              metrica_json:
                status: not implemented
                implementation: null
              footovision:
                status: parsed
                implementation: Tag 44 on a shot; checked before other outcomes.
  kloppy.domain.TakeOnEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 14/'Dribble'
      statsperform:
        status: parsed
        implementation: event type 3/'Take on'
      wyscout_v2:
        status: not implemented
      wyscout_v3:
        status: primary event type 'duel' and secondary event type contains 'dribble'
        implementation: null
      sportec:
        status: not supported
        implementation: null
      metrica_json:
        status: parsed
        implementation: event type 45/'DRIBBLE'
      footovision:
        status: parsed
        implementation: Tag 34; takes precedence over carry, clearance and duel tags.
    attributes:
      result:
        providers:
          statsbomb:
            status: parsed
          metrica_json:
            status: parsed
          footovision:
            status: parsed
        values:
          COMPLETE:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 8/'Complete'
              metrica_json:
                status: parsed
                implementation: outcome 48/'WON'
              footovision:
                status: parsed
                implementation: Tag 450.
          INCOMPLETE:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 9/'Incomplete' and dribble has no related event of type 4/'Duel' with outcome 14/'Lost Out' or 17/'Success Out'
              metrica_json:
                status: parsed
                implementation: outcome 49/'LOST'
              footovision:
                status: inferred
                implementation: No tag 450 and no following ball-out context.
          OUT:
            providers:
              statsbomb:
                status: parsed
                implementation: outcome 9/'Incomplete' and dribble has related event of type 4/'Duel' with outcome 14/'Lost Out' or 17/'Success Out'
              metrica_json:
                status: not supported
                implementation: null
              footovision:
                status: inferred
                implementation: No tag 450 and the next relevant ball-context record in the same period has tag 82.
  kloppy.domain.CarryEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 43/'Carry'
      statsperform:
        status: not supported
        implementation: null
      sportec:
        status: not implemented
        implementation: null
      metrica_json:
        status: parsed
        implementation: event type 10/'CARRY'
      impect:
        status: parsed
        implementation: event type 'DRIBBLE'
      footovision:
        status: parsed
        implementation: Tag 2.
    attributes:
      end_timestamp:
        providers:
          statsbomb:
            status: parsed
            implementation: sum of 'timestamp' and 'duration' fields
          metrica_json:
            status: parsed
            implementation: time difference between event's end time and start of period
          footovision:
            status: parsed
            implementation: endTime converted from milliseconds to timedelta within the period.
      end_coordinates:
        providers:
          statsbomb:
            status: parsed
            implementation: value of 'carry.end_location' field
          metrica_json:
            status: parsed
            implementation: value of 'event.end' field
          footovision:
            status: parsed
            implementation: endX/endY, transformed to the requested coordinate system.
      result:
        providers:
          statsbomb:
            status: parsed
          metrica_json:
            status: parsed
          footovision:
            status: inferred
        values:
          COMPLETE:
            providers:
              statsbomb:
                status: parsed
                implementation: all events of type 43/'Carry'
              metrica_json:
                status: parsed
                implementation: all events of type 10/'CARRY'
              footovision:
                status: inferred
                implementation: The next relevant ball-context record belongs to the same team, or no next record exists.
          INCOMPLETE:
            providers:
              statsbomb:
                status: not supported
              metrica_json:
                status: not supported
              footovision:
                status: inferred
                implementation: The next relevant ball-context record in the same period has a different teamId.
  kloppy.domain.ClearanceEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 9/'Clearance' or a keeper sweeper clearance event (23/'Goalkeeper' event with type 27/'Keeper sweeper' and outcome 48/'Clear') in which the goalkeeper uses their head or feet
      statsperform:
        status: parsed
        implementation: event type 12/'Clearance'
      wyscout_v2:
        status: parsed
        implementation: subevent type 71/'Clearance'
      wyscout_v3:
        status: parsed
        implementation: primary event type 'clearance'
      sportec:
        status: not implemented
        implementation: null
      metrica_json:
        status: not implemented
        implementation: null
      impect:
        status: parsed
        implementation: event type 'CLEARANCE'
      footovision:
        status: parsed
        implementation: Tag 35.
  kloppy.domain.InterceptionEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 10/' Interception' or event type 30/'Pass' with type 64/'One touch interception'
      statsperform:
        status: parsed
        implementation: event type 8/'Interception' or 74/'Blocked pass'
      wyscout_v2:
        status: parsed
        implementation: null
      wyscout_v3:
        status: parsed
        implementation: primary event type 'interception'
      sportec:
        status: not implemented
        implementation: null
      metrica_json:
        status: not implemented
        implementation: null
      impect:
        status: parsed
        implementation: event type 'INTERCEPTION'
      footovision:
        status: not implemented
        implementation: The event decoder does not select this event type.
    attributes:
      result:
        providers:
          statsbomb:
            status: parsed
          footovision:
            status: not implemented
        values:
          SUCCESS:
            providers:
              statsbomb:
                status: parsed
                implementation: event type 10/'Interception' with outcome 4/'Won', 15/'Success' or 16/'Success in play', or event type 30/'Pass' with type 64/'One touch interception' 
              footovision:
                status: not implemented
          LOST:
            providers:
              statsbomb:
                status: parsed
                implementation: event type 10/'Interception' with outcome 1/'Lost' or 13/'Lost in play'
              footovision:
                status: not implemented
          OUT:
            providers:
              statsbomb:
                status: parsed
                implementation: event type 10/'Interception' with outcome 14/'Lost out' or 17/'Success out'
              footovision:
                status: not implemented
  kloppy.domain.DuelEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 4/'Duel' or 33/'Fifty-Fifty' or 2/'Ball recovery' with field 'ball_recovery.recovery_failure' or events with attribute "aerial_won"
      statsperform:
        status: parsed
        implementation: event type 7/'Tackle' or 44/'Aerial' or 67/'Fifty-fifty'
      wyscout_v2:
        status: parsed
        implementation: event type 1/'Duel'
      wyscout_v3:
        status: parsed
        implementation: primary event type 'duel' and secondary event type not 'dribble'
      sportec:
        status: not supported
        implementation: null
      metrica_json:
        status: not supported
        implementation: null
      impect:
        status: parsed
        implementation: event type 'GROUND_DUEL' or 'AERIAL_DUEL'
      footovision:
        status: parsed
        implementation: Tag 3, unless classified earlier as a pass, shot, take-on, carry or clearance. One event per raw record; no synthetic opponent duel is added.
    attributes:
      result:
        providers:
          statsbomb:
            status: parsed
          footovision:
            status: inferred
        values:
          WON:
            providers:
              statsbomb:
                status: parsed
                implementation: event type 4/'Duel' with outcome 4/'Won', 15/'Success', 16/'Success in play' or 17/'Success out', or synthetic event from event with field 'aerial_won', or event type 33/'Fifty-fifty' with outcome 4/'Won' or 3/'Success to team'
              footovision:
                status: inferred
                implementation: The next relevant ball-context record in the same period has the same playerId.
          LOST:
            providers:
              statsbomb:
                status: parsed
                implementation: event type 4/'Duel' with outcome 13/'Lost in play' or 14/'Lost out', or type 11/'Aerial lost', or event type 33/'Fifty-fifty' with outcome 1/'Lost' or 2/'Success to opponent', or event type 2/'Ball recovery' with field 'ball_recovery.recovery_failure'
              footovision:
                status: inferred
                implementation: The next relevant ball-context record has a different playerId, or no next record exists.
          NEUTRAL:
            providers:
              statsbomb:
                status: not supported
              footovision:
                status: not implemented
                implementation: No neutral outcome is emitted.
  kloppy.domain.SubstitutionEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 19/'Substition'
      statsperform:
        status: not implemented
        implementation: event type 18/'Player off' and 19/'Player on'
      wyscout_v2:
        status: not implemented
        implementation: null
      wyscout_v3:
        status: not implemented
        implementation: null
      sportec:
        status: parsed
        implementation: event type Substitution
      metrica_json:
        status: not supported
        implementation: null
      impect:
        status: parsed
        implementation: parsed from metadata
      footovision:
        status: parsed
        implementation: Explicit substitution reasons in game.json homeTeamFormations/awayTeamFormations, with distinct nonzero playerOut and playerIn IDs; tag 734 alone is insufficient.
    attributes:
      replacement_player:
        providers:
          statsbomb:
            status: parsed
            value: value of 'substitution.replacement' field
          footovision:
            status: parsed
            implementation: playerIn from an explicit substitution reason, resolved within the team roster.
  kloppy.domain.CardEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 24/'Bad behaviour' or 22/'Foul committed'
      statsperform:
        status: parsed
        implementation: event type 17/'Card'
      wyscout_v2:
        status: parsed
        implementation: event type 2/'Foul' with tag 1701, 1702 or 1703
      wyscout_v3:
        status: parsed
        implementation: primary event type 'infraction' and 'yellow_card' or 'red_card' in secondary event type
      sportec:
        status: parsed
        implementation: event type 'Caution'
      metrica_json:
        status: not implemented
        implementation: null
      impect:
        status: parsed
        implementation: event type 'YELLOW_CARD', 'SECOND_YELLOW_CARD', or 'RED_CARD'
      footovision:
        status: parsed
        implementation: Tag 78 (red) or 79 (yellow, including second yellow).
    attributes:
      card_type:
        providers:
          statsbomb:
            status: parsed
          footovision:
            status: parsed
            implementation: Tag 78 maps to red; tag 79 uses the number of previously encountered yellow cards for the player.
        values:
          FIRST_YELLOW:
            providers:
              statsbomb:
                status: parsed
              sportec:
                status: not implemented
              footovision:
                status: inferred
                implementation: Tag 79 with no previously encountered yellow card for the player.
          SECOND_YELLOW:
            providers:
              statsbomb:
                status: parsed
              sportec:
                status: not implemented
              footovision:
                status: inferred
                implementation: Tag 79 after at least one previously encountered yellow card for the player.
          RED:
            providers:
              statsbomb:
                status: parsed
              sportec:
                status: not implemented
              footovision:
                status: parsed
                implementation: Tag 78; takes precedence over tag 79.
  kloppy.domain.PlayerOnEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 26/'Player On'
      statsperform:
        status: not implemented
        implementation: event type 21/'Player returns'
      wyscout_v2:
        status: not implemented
      wyscout_v3:
        status: not implemented
      sportec:
        status: unknown
      metrica_json:
        status: unknown
      footovision:
        status: parsed
        implementation: Explicit injury or temporary injury reason in game.json formation snapshots with playerIn only; substitutions do not emit separate player-on events.
  kloppy.domain.PlayerOffEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 27/'Player Off'
      statsperform:
        status: not supported
      wyscout_v2:
        status: not implemented
      wyscout_v3:
        status: not implemented
      sportec:
        status: unknown
      metrica_json:
        status: unknown
      footovision:
        status: parsed
        implementation: Explicit injury or temporary injury reason in game.json formation snapshots with playerOut only; substitutions do not emit separate player-off events.
  kloppy.domain.RecoveryEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 2/'Ball Recovery' or a keeper sweeper claim event  (23/'Goalkeeper' event with with type 27/'Keeper sweeper' and outcome 47/'Claim') in which the goalkeeper does not use their hands
      statsperform:
        status: parsed
        implementation: event type 49/'Recovery'
      wyscout_v2:
        status: parsed
        implementation: subevent 70/'Acceleration' or 72/'Touch' without tag 1302
      wyscout_v3:
        status: not implemented
      sportec:
        status: unknown
      metrica_json:
        status: parsed
        implementation: event type 3/'RECOVERY'
      impect:
        status: parsed
        implementation: event type 'LOOSE_BALL_REGAIN'
      footovision:
        status: parsed
        implementation: Tag 455.
  kloppy.domain.MiscontrolEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: event type 38/'Miscontrol'
      statsperform:
        status: parsed
        implementation: event type 61/'Ball touch' with outcome 0.
      wyscout_v2:
        status: parsed
      wyscout_v3:
        status: not implemented
        implementation: subevent 72/'Touch' with tag 1302
      sportec:
        status: unknown
      metrica_json:
        status: not supported
        implementation: null
      footovision:
        status: not implemented
        implementation: The event decoder does not select this event type.
  kloppy.domain.BallOutEvent:
    providers:
      statsbomb:
        status: parsed
        implementation: events with attribute 'out' or StatsBomb event type 30/'Pass', 16/'Shot', 10/'Interception', 4/'Duel' or 23/'Goalkeeper' with an outcome corresponding to ball going out
      statsperform:
        status: parsed
        implementation: even type 5/'Ball out' or 6/'Corner awarded'
      wyscout_v2:
        status: parsed
        implementation: event type 5/'Interruption'
      wyscout_v3:
        status: not implemented
      sportec:
        status: unknown
        implementation: null
      metrica_json:
        status: inferred
        implementation: checks if the event ended out of the field and adds a synthetic out event
      footovision:
